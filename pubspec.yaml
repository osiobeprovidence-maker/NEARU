name: lalao
description: "Lalao — Nigerian-first local community social app for Flutter Android & iOS"
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management & Architecture
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Declarative Routing
  go_router: ^13.2.0

  # Fonts & UI Design System
  google_fonts: ^6.1.0
  cupertino_icons: ^1.0.6
  lucide_icons: ^0.257.0
  cached_network_image: ^3.3.1
  flutter_spinkit: ^5.2.0
  shimmer: ^3.0.0

  # Networking & Convex Backend Client
  http: ^1.2.0
  web_socket_channel: ^2.4.3

  shared_preferences: ^2.2.2

  # Media & Location
  image_picker: ^1.0.7
  geolocator: ^11.0.0
  url_launcher: ^6.2.5
  video_player: ^2.8.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
