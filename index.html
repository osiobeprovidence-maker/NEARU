<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>lalao — Post. Rally. Connect.</title>
    <meta name="description" content="Post, Rally, and connect with people around you on lalao." />
    <meta name="theme-color" content="#4f46e5" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="preconnect" href="https://rare-rooster-878.eu-west-1.convex.cloud" crossorigin />
    <link rel="dns-prefetch" href="https://rare-rooster-878.eu-west-1.convex.cloud" />
    <meta property="og:title" content="lalao — Post. Rally. Connect." />
    <meta property="og:description" content="Post, Rally, and connect with people around you on lalao." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="lalao" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="lalao — Post. Rally. Connect." />
    <meta name="twitter:description" content="Post, Rally, and connect with people around you on lalao." />
  </head>
  <body>
    <div id="root">
      <div
        id="initial-splash"
        style="position: fixed; inset: 0; width: 100vw; height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; background-color: #4f46e5; overflow: hidden; margin: 0; padding: 1.5rem; user-select: none;"
      >
        <img
          id="initial-splash-img"
          src="/icon.svg"
          alt="LALOA"
          width="192"
          height="192"
          style="width: clamp(5rem, 16vw, 12rem); height: clamp(5rem, 16vw, 12rem); object-fit: contain; aspect-ratio: 1 / 1; pointer-events: none; user-select: none;"
        />
      </div>
      <script>
        (function() {
          try {
            var splashImg = localStorage.getItem('lalao_splash_image');
            var splashBg = localStorage.getItem('lalao_splash_bg');
            var container = document.getElementById('initial-splash');
            var img = document.getElementById('initial-splash-img');
            if (splashBg && container) {
              container.style.backgroundColor = splashBg;
            }
            if (splashImg && img) {
              img.src = splashImg;
              img.width = 512;
              img.height = 512;
              img.style.width = '100%';
              img.style.height = 'auto';
              img.style.maxWidth = 'min(85vw, 480px)';
              img.style.maxHeight = 'min(75vh, 480px)';
              img.style.objectFit = 'contain';
              img.style.aspectRatio = '1 / 1';
            }
          } catch(e) {}
        })();
      </script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
